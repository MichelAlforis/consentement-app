# Flow 03 — Tab Jeux → Dé des positions → Solo → Résultat → Quitter
# testIDs : screen-jeux, btn-dice-mode-solo, btn-dice-reroll, btn-dice-quit
# appId iOS : fr.consentement.app

appId: fr.consentement.app

---

- launchApp:
    clearState: false

- waitForAnimationToEnd

# Naviguer vers l'onglet Jeux via la TabBar
- tapOn:
    text: "Jeux"
    optional: true
- tapOn:
    text: "tab.jeux"
    optional: true

# Écran Jeux visible
- assertVisible:
    testID: screen-jeux
    timeout: 3000

# Ouvrir le jeu du Dé
- tapOn:
    text: "Le Dé du Consentement"
    timeout: 3000

# Mode pick — sélectionner Solo
- assertVisible:
    text: "Comment tu veux jouer ?"
    timeout: 3000

- tapOn:
    testID: btn-dice-mode-solo

# Attendre le lancer (animation)
- waitForAnimationToEnd

# Résultat affiché — bouton Nouveau tirage présent
- assertVisible:
    testID: btn-dice-reroll
    timeout: 5000

# Faire un nouveau tirage
- tapOn:
    testID: btn-dice-reroll

- waitForAnimationToEnd

# Quitter
- tapOn:
    testID: btn-dice-quit

# Vérification : retour sur l'écran Jeux
- assertVisible:
    testID: screen-jeux
    timeout: 3000
