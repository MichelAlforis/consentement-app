name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**/*.ts', 'app/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Tests unitaires
        run: pnpm run test:unit

      - name: TypeScript
        run: pnpm exec tsc --noEmit --project tsconfig.check.json

      - name: Build
        # Next.js 15.x bug : exit code non-nul sur "Collecting build traces" en output:'export'
        # même quand l'export static est réussi — on vérifie l'artefact réel.
        run: |
          pnpm run build || {
            if [ -f out/index.html ]; then
              echo "Build trace warning ignoré (out/index.html présent)"
            else
              echo "Build échoué (out/index.html manquant)"
              exit 1
            fi
          }

  vitrine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @ouiclair/vitrine lint

      - name: TypeScript
        run: pnpm --filter @ouiclair/vitrine typecheck

      - name: Build
        run: pnpm --filter @ouiclair/vitrine build
