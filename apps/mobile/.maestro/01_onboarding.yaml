# Flow 01 — Onboarding 4 étapes → home visible
# testID racine : screen-onboarding (OnboardingWizard.tsx)
# testID home   : screen-home       (HomeScreen.tsx)
# testIDs étapes: btn-age-adult, btn-theme-warm, btn-onboarding-continue
# appId iOS : fr.consentement.app  (app.json)

appId: fr.consentement.app

---

# Étape 0 — Lancement
- launchApp:
    clearState: true

- assertVisible:
    testID: screen-onboarding

# ─── Étape 1 : Langue ─────────────────────────────────────────────────────────
- tapOn:
    text: "Français"

# ─── Étape 2 : WelcomeAge — sélectionner 18 ans+ ─────────────────────────────
- tapOn:
    testID: btn-age-adult

# ─── Étape 3 : ThemeSelect — sélectionner Chaleureux (warm) ──────────────────
- tapOn:
    testID: btn-theme-warm

# ─── Étape 4 : Auth — saisir un prénom puis Continuer ────────────────────────
- tapOn:
    id: ".*TextInput.*"
    optional: true
- inputText: "Alex"
- tapOn:
    testID: btn-onboarding-continue

# ─── Résultat : home visible ──────────────────────────────────────────────────
- assertVisible:
    testID: screen-home
    timeout: 5000
